# gitleaks config for the `public-safe` CI job (spec §13.2). Extends the upstream default ruleset;
# secrets live only in Secrets Manager/SSM (REQ-ARCH-30), never in the repo, so any hit fails CI.
title = "Rhema gitleaks policy"

[extend]
useDefault = true

[allowlist]
description = "Paths that are documentation or fixtures, not secret-bearing source."
paths = [
  '''docs/.*''',
  '''.*\.example$''',
  '''pnpm-lock\.yaml''',
  # Better-Auth test fixture (carried from main, 57aaaf5)
  '''apps/api/src/auth\.test\.ts''',
  # the vendored Agent SDK bridge is upstream code, not secret-bearing source (P1.22 sweep)
  '''vendor/.*''',
  # R7DEM.3b (2026-11-04): the generated demo snapshot tree — corpus-derived DATA (canonical-JSON
  # `SnapshotFile` envelopes); `generic-api-key` false-fires on the `"key": "<word>"` envelope
  # field (e.g. `figure_1_signal_map`, `v3-published`). check:demo-corpus is the corpus gate.
  '''packages/demo-corpus/fixtures/synthetic/snapshots/.*''',
  # R7DATA.1 (2026-11-04): same generated-snapshot class on the REAL derived tree — canonical-JSON
  # SnapshotFile envelopes false-firing `generic-api-key` on `"key": "<word>"` fields
  # (figure keys, `vN-published` pair keys). The corpus gate is check:demo-corpus.
  '''packages/demo-corpus/snapshots/.*''',
]

# P1.22 sweep — the only committed-tree hits are these three pinned TEST fixtures (a Better-Auth test
# secret and a quarantine object key, both literals, both valueless outside a test). Narrowly scoped:
# a real credential still fails CI.
# 2026-10-20 (R6CI.1): + `journey2026stb5a` — the citeproc citation-key literal in
# packages/journeys/src/stb5a-helpers.ts. Same fixture class; needed because non-PR events
# (workflow_dispatch/push) make gitleaks-action scan FULL history, where this surfaces.
# 2026-10-22 (R6POST.2): + the sslip.io fixture hostname in infra/config/stages.test.ts —
# `api: "<hostname>"` reads as generic-api-key; it is a test domain literal, not a credential.
regexes = [
  '''test-secret-0123456789abcdef0123456789abcdef''',
  '''quarantine/ws1/up1''',
  # `quarantine/ws<n>/up<n>` is an object-storage KEY (workspace-id/upload-id path), not a
  # credential — used across the web import/quarantine tests (carried from main, 4b1e31f).
  '''quarantine/ws[0-9]+/up[0-9]+''',
  # CITE.1/STB.5a — a CSL-JSON bibliography cite key for the headless journey fixture, not a
  # secret (gitleaks generic-api-key false positive on packages/journeys/src/stb5a-helpers.ts).
  '''journey2026stb5a''',
  '''api\.pr-212\.34\.8\.177\.69\.sslip\.io''',
  # R6FIX.5 (2026-10-27) — Better-Auth user-id TEST fixtures in
  # packages/contracts/src/analytics.test.ts + packages/ledger/src/stripe.test.ts:
  # `fX3QvxfHSOajReFRMpe2VpaX0gQqOc7y` is the opaque auth-id observed in the H11B
  # headed-session evidence (a user identifier, not a credential — valueless as a
  # secret), pinned in history by 90562fe; `betterAuthTestNanoid000000000000` is
  # its synthetic stand-in. Both only ever appear as test literals.
  '''fX3QvxfHSOajReFRMpe2VpaX0gQqOc7y''',
  '''betterAuthTestNanoid000000000000''',
]
