name: CI

# Five-job pipeline per spec §13.2:
#   typecheck/lint/unit -> contracts -> integration -> images -> public-safe
# Jobs may start as thin placeholders that later tickets fill; the pipeline, the licence policy, and
# the public-safe checks are real now (REQ-ARCH-40; REQ-ARCH-37).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Turborepo remote cache is self-hosted on S3 (never Vercel-hosted). CI supplies these from
  # Secrets/OIDC; absent locally the build simply runs without remote cache.
  TURBO_API: ${{ vars.TURBO_API }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: rhema

jobs:
  typecheck-lint-unit:
    name: typecheck / lint / unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # `@rhema/protocols` is a committed workspace member, so the whole graph (incl. the ported skills,
      # manifests, parsers/serializers and their tests) builds and tests here. `@rhema/evals` still
      # resolves to its stub (RHEMA_EVALS_PATH unset).
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build lint typecheck
      - run: pnpm test
      # Upstream-diff gate (REQ-ARCH-5; AC1): the ported skills equal the vendored pin + only sanctioned
      # edits. Self-contained (reads packages/protocols/upstream-pin) — no external repo needed.
      - run: node scripts/check-upstream-diff.mjs
      # protocols_version is frozen over the trio (REQ-SPEC-22 / P0.04 AC5): a trio edit not re-frozen
      # fails here (the hash mechanism itself is unit-tested in scripts/lib/protocols-version.test.mjs).
      - run: node scripts/compute-protocols-version.mjs

  contracts:
    name: contracts
    needs: typecheck-lint-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # P0.02: the contract suites — the REQ-SPEC-14 policy≡kind test, the frozen ClaimVerdict golden, the
      # sidecar/anchor (REQ-OBJ-16/17) and event/notes/analytics schemas, and the @rhema/db deterministic ACs
      # (migrations, immutability + obligation triggers, two-tenant RLS isolation, real-project seed) run here
      # in-process on PGlite (a real Postgres build) — no DB service needed. Mapper conformance and the
      # markdown round-trip corpus land in P0.04–P0.06.
      - run: pnpm --filter @rhema/contracts --filter @rhema/db build
      - run: pnpm exec vitest run packages/contracts packages/db

  integration:
    name: integration
    needs: contracts
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build the graph so the integration workspace's `@rhema/*` dist imports resolve (api + worker + orchestrator
      # + engine + mirror). Vitest transpiles the tests themselves, but they import the built packages.
      - run: pnpm turbo build
      # G21 (ledger G21; P0.15): the FakeEngine integration suite — api + worker + FakeEngine + PGlite end-to-end:
      # gates, orphan resume, cancel, cap exhaustion, stale task, plus the delivered-run Phase-0 exit assessment.
      # DATABASE_URL points the server-Postgres migrate+seed test (D-P0.02-1) at the postgres:16 service; the rest
      # of the suite runs deterministically on in-process PGlite.
      - name: G21 FakeEngine integration suite + server-Postgres migrate/seed (D-P0.02-1)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: pnpm exec vitest run integration
      # The two-uid privilege-separation image (D-P0.06-2): the vitest test builds Dockerfile.privsep-test and runs
      # it with `--cap-add SYS_ADMIN` (uid `agent` denied the secrets file; scoped mount-namespace isolation). It
      # SKIPS where Docker is unavailable; this Linux runner has it.
      - name: two-uid privsep image kernel legs (D-P0.06-2)
        run: pnpm exec vitest run apps/run-task/src/privsep.docker.test.ts

  images:
    name: images (build + scan, pin digests)
    needs: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build @rhema/infra (the provenance builder) AND @rhema/protocols (so the real protocols_version can
      # be computed over the committed trio — D-P0.04-2).
      - run: pnpm --filter @rhema/infra --filter @rhema/protocols build
      - name: Build + scan service images, pin digests, record provenance (REQ-ARCH-39)
        # Build run-task, export, fetcher, egress-proxy per §13.2, scan with Trivy, pin digests, then
        # record the deploy provenance artifact. Placeholder images build today; scans wired here.
        run: |
          set -euo pipefail
          declare -A DIGESTS
          for svc in run-task export fetcher egress-proxy; do
            docker build -f "apps/$svc/Dockerfile" -t "rhema/$svc:${{ github.sha }}" .
            digest=$(docker image inspect "rhema/$svc:${{ github.sha }}" --format '{{ index .Id }}')
            echo "$svc digest: $digest"
            DIGESTS[$svc]=$digest
          done
          echo "image scan (Trivy) + registry digest pinning: wired here; enforced from P0.06"
          # Assemble the pinned-digest map and record provenance {git_sha, image_digests, ...}.
          json="{"
          first=1
          for svc in "${!DIGESTS[@]}"; do
            [ $first -eq 0 ] && json+=","
            json+="\"$svc\":\"${DIGESTS[$svc]}\""
            first=0
          done
          json+="}"
          # The REAL protocols_version over the committed trio (D-P0.04-2): --bare prints just the value,
          # empty when there is no protocols checkout (then the record falls back to its stub-0.0.0 default).
          PROTOCOLS_VERSION="$(node scripts/compute-protocols-version.mjs --bare)"
          echo "protocols_version for provenance: ${PROTOCOLS_VERSION:-<stub fallback>}"
          GIT_SHA="${{ github.sha }}" IMAGE_DIGESTS="$json" STAGE="ci" PROTOCOLS_VERSION="$PROTOCOLS_VERSION" \
            node scripts/record-provenance.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: deploy-provenance
          path: provenance-artifacts/

  public-safe:
    name: public-safe (gitleaks / markers / licence policy)
    needs: typecheck-lint-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Prove the open-source-export fallback builds: `@rhema/protocols-stub` (swapped in for the
      # committed `@rhema/protocols` at export) and the `@rhema/evals` stub (RHEMA_EVALS_PATH unset).
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build --filter=@rhema/protocols-stub --filter=@rhema/evals
      - name: gitleaks (no secrets in the repo — REQ-ARCH-30)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
      - name: licence policy (allowlist + checked-in exceptions — REQ-ARCH-40)
        run: pnpm check:licenses
      - name: no protocol markers in public bundles (REQ-ARCH-33)
        run: pnpm check:protocol-markers
