name: CI

# Five-job pipeline per spec §13.2:
#   typecheck/lint/unit -> contracts -> integration -> images -> public-safe
# Jobs may start as thin placeholders that later tickets fill; the pipeline, the licence policy, and
# the public-safe checks are real now (REQ-ARCH-40; REQ-ARCH-37).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Turborepo remote cache is self-hosted on S3 (never Vercel-hosted). CI supplies these from
  # Secrets/OIDC; absent locally the build simply runs without remote cache.
  TURBO_API: ${{ vars.TURBO_API }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: rhema

jobs:
  typecheck-lint-unit:
    name: typecheck / lint / unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Build WITHOUT the private protocols checkout — a public clone must build against stubs
      # (REQ-ARCH-37). RHEMA_PROTOCOLS_PATH is intentionally unset here.
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build lint typecheck
      - run: pnpm test

  contracts:
    name: contracts
    needs: typecheck-lint-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Placeholder: mapper conformance, hook policy tests, artifact schema tests, markdown
      # round-trip golden corpus land in P0.02–P0.05. For now, contract types must build.
      - run: pnpm --filter @rhema/contracts build
      - run: echo "contracts conformance suite: placeholder (filled by P0.02+)"

  integration:
    name: integration
    needs: contracts
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Placeholder: api + worker against a preview Aurora with a FakeEngine replaying recorded
      # fixtures (gates, orphan resume, cancel, cap exhaustion, stale task) land in P0.08 (ledger G21).
      - run: echo "integration suite: placeholder (filled by P0.08)"

  images:
    name: images (build + scan, pin digests)
    needs: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rhema/infra build # provenance builder used below
      - name: Build + scan service images, pin digests, record provenance (REQ-ARCH-39)
        # Build run-task, export, fetcher, egress-proxy per §13.2, scan with Trivy, pin digests, then
        # record the deploy provenance artifact. Placeholder images build today; scans wired here.
        run: |
          set -euo pipefail
          declare -A DIGESTS
          for svc in run-task export fetcher egress-proxy; do
            docker build -f "apps/$svc/Dockerfile" -t "rhema/$svc:${{ github.sha }}" .
            digest=$(docker image inspect "rhema/$svc:${{ github.sha }}" --format '{{ index .Id }}')
            echo "$svc digest: $digest"
            DIGESTS[$svc]=$digest
          done
          echo "image scan (Trivy) + registry digest pinning: wired here; enforced from P0.06"
          # Assemble the pinned-digest map and record provenance {git_sha, image_digests, ...}.
          json="{"
          first=1
          for svc in "${!DIGESTS[@]}"; do
            [ $first -eq 0 ] && json+=","
            json+="\"$svc\":\"${DIGESTS[$svc]}\""
            first=0
          done
          json+="}"
          GIT_SHA="${{ github.sha }}" IMAGE_DIGESTS="$json" STAGE="ci" \
            node scripts/record-provenance.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: deploy-provenance
          path: provenance-artifacts/

  public-safe:
    name: public-safe (gitleaks / markers / licence policy)
    needs: typecheck-lint-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Build STUB-ONLY: no private protocols/evals checkout present (REQ-ARCH-37).
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build --filter=@rhema/protocols --filter=@rhema/evals
      - name: gitleaks (no secrets in the repo — REQ-ARCH-30)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
      - name: licence policy (allowlist + checked-in exceptions — REQ-ARCH-40)
        run: pnpm check:licenses
      - name: no protocol markers in public bundles (REQ-ARCH-33)
        run: pnpm check:protocol-markers
