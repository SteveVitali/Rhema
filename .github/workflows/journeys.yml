name: journeys

# JOURNEY.1 (REQ-SPEC-29; ADR-016/ADR-020) — the browser-journey acceptance harness against
# Stage-B prod. Two schedules:
#   nightly  — every free leg (the registry minus paid steps); $0 metered spend.
#   weekly   — the same legs PLUS the paid steps (N5/N6/R4/R6) against ONE ≤300-word fixture and
#              one chat turn, bounded by the $5 metered-spend guard.
# Both authenticate to GCP via Workload Identity Federation (github-pool → the repo-attribute
# principalSet), mint a caller token, and the mailbox client signs a Gmail-DWD JWT via IAM
# Credentials against rhema-journeys@ — no key, no mailbox credential, nothing secret in CI.
#
# R6SWP.1 (2026-10-27, F-R6SWP.1-2) — the caller is the federated principalSet itself, NOT an
# impersonated SA: the repair-era step impersonated `vars.JOURNEY_CI_SA`, and that var points
# at the mailbox SA, which holds no self-signing grant — every session-minting leg closed in
# ~1.5s on `iamcredentials signJwt 403` (dispatch 40528915892). auth@v2 also refuses an
# access_token output without a service_account (dispatch 40529512751), and a once-minted
# env token expires mid-suite (signJwt 401 at ~T+57min on the 65-leg dispatch 40532657165),
# so JOURNEY_GCP_ACCESS_TOKEN is left UNSET: the mailbox client's gcloud-ADC fallback mints a
# fresh federated token per signJwt over the exported WIF credentials file — the identity the
# tokenCreator binding in infra/pulumi/journeys.ts actually grants, with no expiry ceiling.

on:
  # R6SWP.1 (2026-10-27) — scheduled sweeps restored at the post-merge-nightly ticket, exactly
  # as the R6CI.1 pause marker directed. Nightly $0 legs run at 06:05Z against `main` HEAD
  # (github.sha on schedule events); the weekly paid leg stays bound to the $5 ISO-week
  # guard + the standing --headroom 3 below. Until the launch deploy (R6LCH.1) carries `main`
  # HEAD to prod, each nightly reads provenance NO-MATCH on the deployed `dc3a8f6` — honest
  # red, closing itself the first nightly after that deploy (GD-THRESH6.R6's literal arm).
  schedule:
    - cron: "5 6 * * *" # nightly $0 legs
    - cron: "35 4 * * 1" # weekly paid leg (Monday 04:35 UTC — inside the off-peak window)
  workflow_dispatch:
    inputs:
      stage:
        description: "target stage (prod resolves to rhema.tools / api.rhema.tools; other stages need JOURNEY_WEB_URL/JOURNEY_API_URL env)"
        type: string
        default: "prod"
      paid:
        description: "include the paid legs (≤$5 cap)"
        type: boolean
        default: false
      steps:
        description: "comma-separated step ids (default: full registry)"
        required: false
        default: ""
      expect-sha:
        description: "SHA the provenance assert expects deployed (default: github.sha — a dispatch may pin the deployed SHA for an on-deployed-SHA green run)"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write # WIF — the CI caller credential for signJwt

env:
  JOURNEY_WEB_URL: https://rhema.tools
  JOURNEY_API_URL: https://api.rhema.tools
  JOURNEY_STATE_DIR: .journeys-state

jobs:
  journeys:
    name: journeys
    runs-on: ubuntu-latest
    # R6SWP.1 (2026-10-27, F-R6SWP.1-1): the first CI execution of the suite EVER (every
    # scheduled run since ≥2026-10-08 died at the WIF auth step inside ~1 min — the 30-min
    # ceiling was never exercised) timed out at 30m mid-registry (dispatch 40523029148:
    # 19 legs' artifacts, no report.json). Observed cadence ~1.5 min/leg average → 44-leg
    # nightly ≈70–90 min, 65-leg weekly ≈100–130 min; 180 covers both with headroom.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          # R6ENG.1 (REQ-ENG-8): the deploy-neutral drift arm runs `git merge-base`/`git diff`
          # against the deployed SHA — ancestry is unresolvable under the default depth-1
          # clone, so the workflow fetches full history.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rhema/journeys build
      - name: Install Chrome (the scheduled run's browser channel)
        run: pnpm --filter @rhema/journeys exec playwright install chrome
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.JOURNEY_WIF_PROVIDER }}
          # F-R6SWP.1-2: NO service_account + NO token_format — auth@v2 refuses access_token
          # output without impersonation (dispatch 40529512751), and impersonation made the
          # caller the mailbox SA itself, which cannot self-sign (signJwt 403 on every
          # session leg, dispatch 40528915892). The credentials file IS the federated
          # principalSet identity; the run step mints its access token via ADC below — the
          # identity the tokenCreator binding in infra/pulumi/journeys.ts actually grants.
          create_credentials_file: true
      - name: Start Cloud SQL Auth Proxy (env-gap legs' read pool)
        # R6DEP.4 — the free env-gap legs (T7/R6F/T12F/T13F + the N9/T8 self-healing arms) read
        # own-tenant rows through JOURNEY_DATABASE_URL, bound to the prod app-login DSN whose host
        # is the VPC-private Cloud SQL IP (10.46.0.3) — unreachable from a GitHub runner. The
        # proxy carries it over the federated WIF credentials the auth step already exported
        # (GOOGLE_APPLICATION_CREDENTIALS → ADC); the infra/pulumi grant is roles/cloudsql.client
        # on the repo principalSet. Skipped on the paid arm: an app-login pool can never satisfy
        # the paid spend guard (it probes rolsuper/rolbypassrls and fails closed), so the weekly
        # self-bounding cron keeps its no-db attestation — env + proxy stay exactly absent there,
        # today's behavior verbatim.
        if: ${{ !((github.event_name == 'schedule' && github.event.schedule == '35 4 * * 1') || inputs.paid) }}
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/cloud-sql-proxy \
            https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.15.2/cloud-sql-proxy.linux.amd64
          echo '31607582f62be0109ee09c9165dafc7bb585c29108fc6b7b9734f3797acdd357  /tmp/cloud-sql-proxy' | sha256sum -c -
          chmod +x /tmp/cloud-sql-proxy
          /tmp/cloud-sql-proxy rhema-507501:us-central1:rhema-prod-postgres \
            --address 127.0.0.1 --port 15433 >/tmp/cloud-sql-proxy.log 2>&1 &
          for i in $(seq 1 30); do
            (echo >"/dev/tcp/127.0.0.1/15433") 2>/dev/null && exit 0
            sleep 1
          done
          cat /tmp/cloud-sql-proxy.log
          exit 1
      - name: Run the journey suite
        env:
          # GOOGLE_APPLICATION_CREDENTIALS is exported by the auth step above (the federated
          # WIF identity's external_account file — ADC can mint its access token).
          # A dispatch may pin the expected SHA explicitly (e.g. the deployed SHA for an
          # on-deployed green run); the schedule always pins github.sha.
          JOURNEY_EXPECT_SHA: ${{ inputs['expect-sha'] || github.sha }}
          JOURNEY_PAID: ${{ (github.event_name == 'schedule' && github.event.schedule == '35 4 * * 1') || inputs.paid }}
          # R6DEP.4 — the operator-bound env-gap secrets (2026-10-30, GD-THRESH1.R6-style ruling).
          # JOURNEY_DATABASE_URL is NEVER auto-injected by Actions — this mapping is the missing
          # half that left T7/R6F/T12F/T13F red on dispatch 40965117844.
          JOURNEY_T8_EXPORT_TOKEN: ${{ secrets.JOURNEY_T8_EXPORT_TOKEN }}
          JOURNEY_DATABASE_URL_BOUND: ${{ secrets.JOURNEY_DATABASE_URL }}
        run: |
          set -uo pipefail
          # R6DEP.4 — rewrite the bound DSN's host to the local proxy listener (the secret carries
          # the VPC-private IP verbatim; ssl params are stripped — the proxy terminates TLS). Paid
          # runs skip it entirely (see the proxy step): an app-login pool can never satisfy the
          # paid spend guard, so this arm preserves the cron's no-db attestation verbatim.
          # Diagnostic prints ONLY the DSN username — never the password/host payload.
          if [ "${JOURNEY_PAID:-false}" != "true" ] && [ -n "${JOURNEY_DATABASE_URL_BOUND:-}" ]; then
            export JOURNEY_DATABASE_URL="$(node -e '
              const u = new URL(process.env.JOURNEY_DATABASE_URL_BOUND);
              console.error("journey dsn user:", u.username);
              u.hostname = "127.0.0.1"; u.port = "15433";
              for (const k of [...u.searchParams.keys()]) if (/^ssl/i.test(k)) u.searchParams.delete(k);
              u.searchParams.set("sslmode", "disable");
              console.log(u.toString());')"
          fi
          unset JOURNEY_DATABASE_URL_BOUND
          # F-R6SWP.1-2 — NO JOURNEY_GCP_ACCESS_TOKEN export: a once-minted env token dies at
          # its 3600s lifetime mid-suite (T4–T7 closed signJwt 401 at ~T+57min on dispatch
          # 40532657165). Leaving it unset drops the mailbox onto its gcloud-ADC path, which
          # mints a FRESH federated token per signJwt call over the auth step's exported
          # GOOGLE_APPLICATION_CREDENTIALS file — no expiry, no impersonation.
          args=(--web "$JOURNEY_WEB_URL" --api "$JOURNEY_API_URL" \
                --state-dir "$JOURNEY_STATE_DIR" \
                --out "journey-report")
          args+=(--stage "${{ inputs.stage || 'prod' }}")
          [ -n "${JOURNEY_EXPECT_SHA:-}" ] && args+=(--expect-sha "$JOURNEY_EXPECT_SHA")
          # R5ECON.1 (REQ-ECON-9) — --headroom is required on every paid dispatch; the cron's
          # standing per-leg bound is $3 (the ≤300-word fixture's worst observed leg ×2).
          [ "${JOURNEY_PAID:-false}" = "true" ] && args+=(--paid --headroom 3)
          [ -n "${{ inputs.steps }}" ] && args+=(--steps "${{ inputs.steps }}")
          # F-R6DEP.2-1 (2026-10-26): `pnpm --filter @rhema/journeys exec rhema-journeys` can
          # never resolve — pnpm links a package's bin only into its importers' node_modules/.bin,
          # and nothing depends on @rhema/journeys (verified on dispatch run 40363400137:
          # ERR_PNPM_RECURSIVE_EXEC_FIRST_FAIL after the WIF auth fix). Invoke the built CLI
          # directly from the workspace root so --out / JOURNEY_STATE_DIR relative paths land
          # where upload-artifact expects them.
          node packages/journeys/dist/cli.js "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journey-report-${{ github.run_id }}
          path: journey-report/
