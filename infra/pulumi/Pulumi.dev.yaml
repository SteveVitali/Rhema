# Pulumi stack: dev — the shared-integration stage (OPS.1 — full-stack rewrite 2026-10-04).
#
# OPS.1 takes dev off the 23-resource skeleton (STB.1 run ledger §1) to the full production-parity
# program: AlloyDB + Redis + GKE + egress-proxy MIG + the seven Cloud Run services + the in-VPC
# `migrate` Job. Two OPS.1 changes make a fresh `dev` boot with NO hand-set secret configs:
#
#   1. IaC-generated secrets (owned decision (c); stages.ts NONPROD_GENERATED_SECRET_IDS): the
#      program mints the postgres bootstrap password, the rhema_app_login/rhema_collab role DSNs,
#      the composed system DSN, the RS256 run-token keypair, better-auth + email-action secrets —
#      all as Secret Manager VERSIONS on the stack-local containers. Values live in encrypted
#      Pulumi state + SM only. The stale hand-encrypted `rhema:*DatabaseUrl` configs were dropped:
#      the generated `*-database-url` secretKeyRefs win by `requiredSecrets` gating in compute.ts.
#   2. The in-VPC `migrate` Job (owned decision (b)) runs migrations + `ALTER ROLE … LOGIN` for the
#      generated role passwords + the real-project seed (dev is the only stage allowed it) inside
#      the VPC — no operator tunnel, no hand ALTER.
#
# What IS still operator-set here:
#   rhema:serviceImages / rhema:runTaskImageDigest / rhema:proxyImage — the digest-pinned image
#     set for the `rhema-dev` AR repo. Stage B builds all nine on the OPS.1 tip and pins them
#     below (production-parity pins: the same SHAs prod would carry at this code line, pushed to
#     the dev repo — never `rhema-prod-*` refs, REQ-ARCH-38).
#   rhema:anthropic-api-key — seeded as a Secret Manager version on `rhema-dev-anthropic-api-key`
#     (the NON-prod provider key — value never in this file or any ledger).
#
# NOT set (by design): no `rhema:*DatabaseUrl`, no `rhema:redisUrl` (composed off the Memorystore
# output), no Stripe/Resend/Google-OAuth secrets (DEV_REQUIRED_SECRETS excludes them — the
# gated consumers fail closed with named reasons), no domains (web self-wires the api's
# *.run.app uri; signup.mode=invite from the stage facts).
config:
  gcp:project: rhema-507501
  gcp:region: us-central1
  rhema:placeholderImage: us-docker.pkg.dev/cloudrun/container/hello
  rhema:deployProxyMig: "true"
  # SEC.3 — run-task pods run under the Localhost `rhema-run-task` AppArmor profile (the loader
  # DaemonSet lands it via infra/k8s/apply.sh — run after `pulumi up`, same as prod).
  rhema:runTaskAppArmorType: Localhost
  rhema:runTaskAppArmorLocalhostProfile: rhema-run-task
  # OPS.1 Stage B — the nine-service digest set for the rhema-dev AR repo (filled by the deploy
  # step; comment kept so the pin shape matches prod's). Until these land the services run the
  # placeholder and the stack stays a substrate-only bring-up.
  # rhema:serviceImages: '{"api":"us-central1-docker.pkg.dev/rhema-507501/rhema-dev/api@sha256:…","web":"…","worker":"…","fetcher":"…","convert":"…","export":"…","collab":"…"}'
  # rhema:runTaskImageDigest: us-central1-docker.pkg.dev/rhema-507501/rhema-dev/run-task@sha256:…
  # rhema:proxyImage: us-central1-docker.pkg.dev/rhema-507501/rhema-dev/egress-proxy@sha256:…
