name: rhema
runtime:
  name: nodejs
  options:
    packagemanager: npm
description: >-
  Rhema GCP infrastructure (spec 13.1/13.2): Cloud Run, a GKE cluster for run-task, AlloyDB, GCS,
  Memorystore Redis, HTTPS LB + CDN, Secret Manager, and the no-egress sandbox subnet.
main: index.ts
# Provider config (gcp:project / gcp:region) is set per-stack in Pulumi.<stack>.yaml, not here — Pulumi
# rejects provider-namespaced defaults in the project file. index.ts also falls back to rhema-507501 /
# us-central1 when a stack does not set them.
