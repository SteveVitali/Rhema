#
# The stack name IS the stage name (`prod` → the stage facts' prod profile: warm Cloud SQL
# db-g1-small — Postgres engine amended 2026-09-17 from AlloyDB for the ~$50/mo budget — BASIC
# Memorystore, ZONAL GKE + 1 e2-medium node, $100/run guard, signup.mode=open, the real
# rhema.tools / *.usercontent.rhema.tools domains — same-day single-zone amendment).
# Non-secret config is committed; every SECRET below is set with
# `pulumi config set --secret` IN THE OPERATOR'S ENVIRONMENT ONLY — never committed (REQ-ARCH-30).
#
# Operator secrets to set before `pulumi up` (values are HUMAN-H6's out-of-band material):
#   rhema:alloydbPassword          — postgres bootstrap password (engine-agnostic name; binds the
#                                    Cloud SQL `postgres` built-in user; also seed the SM container
#                                    rhema-prod-alloydb-password)
#   rhema:proxyDatabaseUrl         — egress-proxy's DATABASE_URL (restricted role; Cloud SQL
#                                    private-IP host — get it via `pulumi stack output databaseHost`)
#   rhema:workerDatabaseUrl        — worker DATABASE_URL (RLS-enforced role)
#   rhema:workerSystemDatabaseUrl  — worker SYSTEM_DATABASE_URL (elevated, cross-tenant sweeps)
#   rhema:appDatabaseUrl           — api DATABASE_URL (RLS-enforced role) — canonical name
#                                    (rhema:apiDatabaseUrl still reads as a fallback for old stacks)
#   rhema:apiSystemDatabaseUrl     — api SYSTEM_DATABASE_URL (circuit-breaker read)
#   rhema:redisUrl                 — Memorystore redis:// URL (shared api + worker + web)
# NOT required (provisioned but intentionally unseeded — amended 2026-09-17):
#   rhema-prod-ops-alert-webhook-url — the drift/balance alert sink; the alert path stays INERT
#                                    until a destination exists (seed a version + re-add the id to
#                                    PROD_REQUIRED_SECRETS to opt back in)
# Operator plain config to set:
#   rhema:serviceImages            — JSON {"api":"…@sha256:…","web":…,"worker":…,"fetcher":…,
#                                    "convert":…,"export":…,"collab":…} (images CI publishes it)
#   rhema:runTaskImageDigest       — …/run-task@sha256:…
#   rhema:proxyImage               — …/egress-proxy@sha256:…
#   rhema:internalApiUrl           — defaults to https://api.rhema.tools when unset
#   rhema:proxyBaseUrl             — the proxy MIG's internal base URL (set after the MIG stands up)
#   rhema:emailFrom                — e.g. hello@rhema.tools (Resend-verified domain)
#   rhema:googleOauthClientId      — PRB.16: the OAuth WEB CLIENT ID from APIs & Services → Credentials
#                                    (plain config — the matching SECRET is SM rhema-prod-google-oauth-client-secret).
#                                    Currently `pending-h6-…` — a marked placeholder that mounts /api/auth/*
#                                    (magic-link + session legs work); Google sign-in 400s at Google until the
#                                    real id + secret land (D-P0.01-3's browser leg → operator).
