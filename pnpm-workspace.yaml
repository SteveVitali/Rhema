# pnpm workspace — the monorepo package graph (spec §13.2).
# Bazel-compatible invariant: every package is an explicit member; cross-package code is consumed
# only through the `@rhema/*` package graph, never a relative import that escapes a package.
packages:
  - "apps/*"
  - "packages/*"
  - "infra"
  - "evals-stub"
  - "integration"
  - "tools/*"
  # `packages/protocols` is a COMMITTED member (name `@rhema/protocols`); the renamed public fallback
  # `@rhema/protocols-stub` (dir `packages/protocols-stub`) is swapped in only at open-source export.
  # `evals/` remains PRIVATE, resolved by path (REQ-ARCH-37) with `evals-stub` (`@rhema/evals`) as its
  # fallback via `.pnpmfile.cjs`; a public clone builds against that stub.
