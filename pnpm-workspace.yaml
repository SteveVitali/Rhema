# pnpm workspace — the monorepo package graph (spec §13.2).
# Bazel-compatible invariant: every package is an explicit member; cross-package code is consumed
# only through the `@rhema/*` package graph, never a relative import that escapes a package.
packages:
  - "apps/*"
  - "packages/*"
  - "infra"
  - "evals-stub"
  - "integration"
  - "tools/*"
  # `packages/protocols` is a COMMITTED member (name `@rhema/protocols`) and — per the 2026-11-02
  # operator ruling (R6OSS.1; ADR-002 amendment/ADR-125; REQ-ARCH-37 re-amended) — ships PUBLIC
  # with the repository; the former export-time swap is retired. `packages/protocols-stub`
  # (`@rhema/protocols-stub`) is retained as a dormant fallback shim, still compiled by `public-safe`.
  # `evals/` remains PRIVATE, resolved by path (REQ-ARCH-37) with `evals-stub` (`@rhema/evals`) as its
  # fallback via `.pnpmfile.cjs`; a public clone builds against that stub.
