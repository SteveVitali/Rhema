# Cloud Build: build + push the full production image set to Artifact Registry, natively on amd64 (the
# run-task/Cloud Run/GKE target arch). Invoked by:
#   gcloud builds submit --config cloudbuild.yaml --project rhema-507501 \
#     --substitutions _AR=<repo>,_TAG=<tag>,_GIT_SHA=$(git rev-parse HEAD)
# where <repo> is the stack's repo the Pulumi program provisions (`us-central1-docker.pkg.dev/rhema-507501/
# rhema-<stack>` — e.g. rhema-prod for prod). The whole repo is the build context (the Dockerfiles
# COPY . . and pnpm install from the lockfile); the .gcloudignore keeps installed deps/build outputs out
# of the upload while KEEPING apps/run-task/vendor.
#
# PRB.15 — the set is every service the prod stack deploys: the run-task GKE Job image, the egress-proxy
# MIG image, the six Cloud Run services (api, web, worker, collab, fetcher, export), and the convert
# Cloud Run Job. After the build, the operator pins the pushed DIGESTS into `rhema:serviceImages` /
# `rhema:runTaskImageDigest` / `rhema:proxyImage` before `pulumi up` (REQ-ARCH-39).
substitutions:
  _AR: us-central1-docker.pkg.dev/rhema-507501/rhema-dev
  _TAG: dev
  # JOURNEY.1 — callers pass the built commit (gcloud builds submit has no $COMMIT_SHA — that
  # substitution only exists for repo-connected triggers). A trigger can map _GIT_SHA=$COMMIT_SHA.
  _GIT_SHA: unknown
# BuildKit is required: the Dockerfiles use `FROM --platform=$TARGETPLATFORM`, and the automatic
# platform ARGs (TARGETPLATFORM/BUILDPLATFORM) are only populated by BuildKit. Without DOCKER_BUILDKIT=1
# the classic builder leaves $TARGETPLATFORM empty and fails ("invalid platform component"). On Cloud
# Build the host is amd64, so TARGETPLATFORM resolves to linux/amd64 (the run-task/Cloud Run target).
steps:
  - id: run-task
    name: gcr.io/cloud-builders/docker
    env: ["DOCKER_BUILDKIT=1"]
    args: ["build", "-f", "apps/run-task/Dockerfile", "-t", "${_AR}/run-task:${_TAG}", "."]
  - id: egress-proxy
    name: gcr.io/cloud-builders/docker
    env: ["DOCKER_BUILDKIT=1"]
    args: ["build", "-f", "apps/egress-proxy/Dockerfile", "-t", "${_AR}/egress-proxy:${_TAG}", "."]
  - id: api
    name: gcr.io/cloud-builders/docker
    env: ["DOCKER_BUILDKIT=1"]
    # JOURNEY.1 (REQ-ARCH-39) — GIT_SHA bakes the built commit into the image for /healthz's
    # build.gitSha (the deploy-provenance check); _GIT_SHA is caller-supplied (see substitutions).
    args: ["build", "-f", "apps/api/Dockerfile", "--build-arg", "GIT_SHA=${_GIT_SHA}", "-t", "${_AR}/api:${_TAG}", "."]
  - id: web
    name: gcr.io/cloud-builders/docker
    env: ["DOCKER_BUILDKIT=1"]
    args: ["build", "-f", "apps/web/Dockerfile", "--build-arg", "GIT_SHA=${_GIT_SHA}", "-t", "${_AR}/web:${_TAG}", "."]
  - id: worker
    name: gcr.io/cloud-builders/docker
    env: ["DOCKER_BUILDKIT=1"]
    args: ["build", "-f", "apps/worker/Dockerfile", "-t", "${_AR}/worker:${_TAG}", "."]
  - id: fetcher
    name: gcr.io/cloud-builders/docker
    env: ["DOCKER_BUILDKIT=1"]
    args: ["build", "-f", "apps/fetcher/Dockerfile", "-t", "${_AR}/fetcher:${_TAG}", "."]
  - id: convert
    name: gcr.io/cloud-builders/docker
    env: ["DOCKER_BUILDKIT=1"]
    args: ["build", "-f", "apps/convert/Dockerfile", "-t", "${_AR}/convert:${_TAG}", "."]
  - id: export
    name: gcr.io/cloud-builders/docker
    env: ["DOCKER_BUILDKIT=1"]
    args: ["build", "-f", "apps/export/Dockerfile", "-t", "${_AR}/export:${_TAG}", "."]
  - id: collab
    name: gcr.io/cloud-builders/docker
    env: ["DOCKER_BUILDKIT=1"]
    args: ["build", "-f", "apps/collab/Dockerfile", "-t", "${_AR}/collab:${_TAG}", "."]
images:
  - "${_AR}/run-task:${_TAG}"
  - "${_AR}/egress-proxy:${_TAG}"
  - "${_AR}/api:${_TAG}"
  - "${_AR}/web:${_TAG}"
  - "${_AR}/worker:${_TAG}"
  - "${_AR}/fetcher:${_TAG}"
  - "${_AR}/convert:${_TAG}"
  - "${_AR}/export:${_TAG}"
  - "${_AR}/collab:${_TAG}"
options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
timeout: 3600s
